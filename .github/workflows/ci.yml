name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Servidor MCP (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  addin:
    name: Add-in Revit (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Sem Revit no runner: o csproj usa os assemblies de referência do NuGet.
      - run: dotnet build addin/RevitMcp.csproj -c Release -nologo -warnaserror:CS0618
